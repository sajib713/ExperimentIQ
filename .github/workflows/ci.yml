name: Automated tests and PostgreSQL integration
on:
  push:
  pull_request:
jobs:
  full-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: experimentiq_test
          POSTGRES_USER: experimentiq_test
          POSTGRES_PASSWORD: ci_only_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U experimentiq_test -d experimentiq_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://experimentiq_test:ci_only_test_password@localhost:5432/experimentiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,postgres]'
      - name: Unit, fixture E2E, SQL and PostgreSQL integration
        run: pytest -q
      - name: Validate browser JavaScript syntax
        run: node --check dashboard/app.js
