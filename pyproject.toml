[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "experimentiq"
version = "1.0.0"
description = "Auditable randomized marketing experiment analysis and decision intelligence"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0", "numpy>=1.24,<3.0", "scipy>=1.11,<2.0", "statsmodels>=0.14,<1.0"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4.0"]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
